<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhập Kiểm Diện — Trường TH Đặng Văn Bất</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, #e0f2fe 0%, #f0fdf4 55%, #ecfdf5 100%);
    color: #1e293b;
    min-height: 100vh;
    padding: 0 12px 40px;
  }
  .page { max-width: 860px; margin: 0 auto; }
  .hero { padding: 12px 0 0; }
  .banner {
    width: 100%; height: auto; display: block;
    border-radius: 16px; box-shadow: 0 4px 18px rgba(2, 132, 199, .25);
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .card {
    background: #fff; border-radius: 16px;
    box-shadow: 0 2px 12px rgba(15, 23, 42, .08);
    padding: 16px; margin-top: 14px;
  }
  .datebox { text-align: center; padding: 6px 0 2px; }
  .date-label { font-size: 13px; color: #64748b; letter-spacing: .04em; text-transform: uppercase; }
  .date-value { font-size: 24px; font-weight: 800; color: #0369a1; margin-top: 2px; }
  .picker-card label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #0f766e; }
  #classPicker {
    width: 100%; font-size: 17px; padding: 12px 14px;
    border: 2px solid #38bdf8; border-radius: 12px; background: #f0f9ff;
    color: #0c4a6e; font-weight: 600; outline: none; appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230369a1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat; background-position: right 12px center; background-size: 20px;
  }
  #classPicker:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, .2); }
  .progress-wrap { margin-top: 12px; }
  .progress-bar { height: 12px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, #16a34a); border-radius: 999px; transition: width .3s ease; }
  .progress-text { font-size: 14px; color: #15803d; font-weight: 700; margin-top: 6px; text-align: center; }
  .toolbar { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .dropdown { position: relative; }
  .btn {
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    border: none; border-radius: 12px; padding: 12px 20px;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn-secondary { background: #fff; color: #0369a1; border: 2px solid #38bdf8; box-shadow: 0 2px 8px rgba(2, 132, 199, .12); }
  .btn-secondary:hover { background: #f0f9ff; }
  .btn-primary {
    background: linear-gradient(135deg, #2563eb, #0891b2); color: #fff;
    box-shadow: 0 4px 14px rgba(37, 99, 235, .35); width: 100%;
  }
  .btn-primary:hover { box-shadow: 0 6px 18px rgba(37, 99, 235, .45); }
  .btn-large { font-size: 18px; padding: 16px 24px; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .dropdown-menu {
    display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
    min-width: 260px; background: #fff; border-radius: 12px;
    box-shadow: 0 8px 28px rgba(15, 23, 42, .18); border: 1px solid #e2e8f0;
    overflow: hidden; padding: 6px;
  }
  .dropdown-menu.open { display: block; }
  .dropdown-menu button {
    display: block; width: 100%; text-align: left; font-family: inherit;
    font-size: 15px; font-weight: 600; color: #1e293b; background: none;
    border: none; border-radius: 8px; padding: 11px 12px; cursor: pointer;
  }
  .dropdown-menu button:hover { background: #f0f9ff; color: #0369a1; }
  #pickDateInput {
    font-family: inherit; font-size: 15px; padding: 10px 12px;
    border: 2px solid #38bdf8; border-radius: 12px; background: #f0f9ff; color: #0c4a6e;
  }
  .hidden { display: none !important; }
  .notice {
    margin-top: 14px; padding: 12px 14px; border-radius: 12px;
    font-size: 15px; font-weight: 600; line-height: 1.5; display: none;
  }
  .notice.show { display: block; }
  .notice.info { background: #e0f2fe; color: #075985; border: 1px solid #7dd3fc; }
  .notice.warn { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
  .notice.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .notice.ok { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
  .totals {
    display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px;
  }
  .total-chip {
    flex: 1 1 120px; background: #fff; border-radius: 12px; padding: 10px 12px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, .06); text-align: center;
  }
  .total-chip .num { font-size: 22px; font-weight: 800; color: #0369a1; }
  .total-chip .lbl { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .class-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
  @media (min-width: 640px) { .class-grid { grid-template-columns: 1fr 1fr; } }
  .class-card {
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 2px 10px rgba(15, 23, 42, .07);
    border: 2px solid transparent;
  }
  .class-card.has-data { border-color: #86efac; }
  .class-card.single { grid-column: 1 / -1; }
  .class-card.single input[type="number"] { font-size: 22px; padding: 14px; }
  .class-card.single input[type="text"] { font-size: 18px; padding: 14px; }
  .class-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .class-name { font-size: 19px; font-weight: 800; color: #0f766e; }
  .class-meta { font-size: 13px; color: #64748b; font-weight: 600; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 4px; }
  .field input {
    width: 100%; font-family: inherit; font-size: 16px; padding: 10px 12px;
    border: 2px solid #cbd5e1; border-radius: 10px; outline: none; background: #fff;
  }
  .field input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, .2); }
  .field input:disabled { background: #f1f5f9; color: #64748b; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hd-line { font-size: 14px; font-weight: 700; color: #15803d; margin-top: 4px; }
  .bottom-actions { margin-top: 20px; }
  .foot-note { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <img src="banner-so-kiem-dien.png" alt="Sổ kiểm diện — Trường Tiểu học Đặng Văn Bất" class="banner">
    <h1 class="sr-only">Nhập Kiểm Diện — Trường Tiểu học Đặng Văn Bất</h1>
  </header>

  <section class="card controlbar">
    <div class="datebox">
      <div class="date-label">Ngày kiểm diện</div>
      <div class="date-value" id="dateValue">—</div>
    </div>
    <div class="picker-card" style="margin-top:12px">
      <label for="classPicker">Chọn lớp</label>
      <select id="classPicker"></select>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">Đã nhập 0/32 lớp</div>
      </div>
    </div>
    <div class="toolbar">
      <div class="dropdown">
        <button id="btnHistory" class="btn btn-secondary" type="button">Tải lịch sử ▾</button>
        <div class="dropdown-menu" id="historyMenu">
          <button type="button" data-hist="month-to-now">Từ đầu tháng đến hôm nay</button>
          <button type="button" data-hist="whole-month">Trọn tháng này</button>
          <button type="button" data-hist="pick-date">Ngày cụ thể…</button>
        </div>
      </div>
      <input type="date" id="pickDateInput" class="hidden" aria-label="Chọn ngày cần tải">
    </div>
    <div class="notice" id="notice"></div>
  </section>

  <main id="formArea">
    <div class="totals">
      <div class="total-chip"><div class="num" id="totVang">0</div><div class="lbl">HS vắng</div></div>
      <div class="total-chip"><div class="num" id="totVangBT">0</div><div class="lbl">Vắng bán trú</div></div>
      <div class="total-chip"><div class="num" id="totHD">0</div><div class="lbl">Hiện diện</div></div>
    </div>
    <div class="class-grid" id="classGrid"></div>
  </main>

  <div class="bottom-actions">
    <button id="btnExportBottom" class="btn btn-primary btn-large" type="button">Xuất file Excel</button>
  </div>

  <p class="foot-note">Nhập kiểm diện 5:00–8:10 sáng các ngày đi học.<br>Dữ liệu lưu trên máy/trình duyệt đang dùng — file Excel đã xuất là bản lưu chính thức.</p>
</div>

/* ---------- Ngày giờ theo múi giờ Việt Nam (Asia/Saigon) ---------- */
const fmtDateSG = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Saigon", year: "numeric", month: "2-digit", day: "2-digit" });
const fmtTimeSG = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Saigon", hourCycle: "h23", hour: "2-digit", minute: "2-digit" });

function todaySG() { return fmtDateSG.format(new Date()); } /* "YYYY-MM-DD" */
function minutesSG() {
  const parts = fmtTimeSG.formatToParts(new Date());
  let h = 0, m = 0;
  for (const p of parts) { if (p.type === "hour") h = parseInt(p.value, 10); if (p.type === "minute") m = parseInt(p.value, 10); }
  return ((h % 24) * 60) + m; /* %24: chống giờ "24" ở một số trình duyệt */
}
function parseISO(s) { const a = s.split("-").map(Number); return new Date(Date.UTC(a[0], a[1] - 1, a[2])); }
function weekdayOf(iso) { return WEEKDAYS[parseISO(iso).getUTCDay()]; }
function isWeekend(iso) { const d = parseISO(iso).getUTCDay(); return d === 0 || d === 6; }
function fmtDMY(iso) { const a = iso.split("-"); return a[2] + "/" + a[1] + "/" + a[0]; }
function fmtDM(iso) { const a = iso.split("-"); return a[2] + "." + a[1]; }
function excelNameFor(iso) { return "KIỂM DIỆN " + fmtDM(iso) + ".xlsx"; }
function addDaysISO(iso, n) { const d = parseISO(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

/* ---------- Lưu trữ theo từng ngày ---------- */
function historyKey(dateStr) { return "kiemdien-lich-su-" + dateStr; }
function loadHistory(dateStr) {
  try { const raw = localStorage.getItem(historyKey(dateStr)); if (!raw) return null; const obj = JSON.parse(raw); return (obj && obj.data) ? obj.data : null; }
  catch (e) { return null; }
}
function saveHistory(dateStr, data) {
  try { localStorage.setItem(historyKey(dateStr), JSON.stringify({ date: dateStr, data: data })); } catch (e) { /* bộ nhớ đầy: bỏ qua */ }
}
function hasHistory(dateStr) { return loadHistory(dateStr) !== null; }
function migrateOldDraft() {
  try {
    const raw = localStorage.getItem("kiemdien-nhap-hien-tai");
    if (!raw) return;
    const obj = JSON.parse(raw);
    if (obj && obj.date && obj.data && !hasHistory(obj.date)) saveHistory(obj.date, obj.data);
    localStorage.removeItem("kiemdien-nhap-hien-tai");
  } catch (e) { try { localStorage.removeItem("kiemdien-nhap-hien-tai"); } catch (e2) {} }
}

  const sel = $("classPicker");
  const ph = document.createElement("option"); ph.value = ""; ph.textContent = "— Chọn lớp —"; sel.appendChild(ph);
  const all = document.createElement("option"); all.value = "all"; all.textContent = "Tất cả các lớp"; sel.appendChild(all);
  for (let k = 1; k <= 5; k++) {
    const grp = document.createElement("optgroup"); grp.label = "Khối " + k;
    CLASSES.filter(c => c.khoi === k).forEach(c => {
      const o = document.createElement("option"); o.value = c.id; o.textContent = "Lớp " + c.id + " — " + c.gv; grp.appendChild(o);
    });
    sel.appendChild(grp);
  }
  sel.value = "all";
}

function buildCards() {
  const grid = $("classGrid");
  CLASSES.forEach(c => {
    const card = document.createElement("section");
    card.className = "class-card";
    card.dataset.classId = c.id;
    card.innerHTML =
      '<div class="class-head"><div class="class-name">Lớp ' + c.id + '</div>' +
      '<div class="class-meta">Sĩ số ' + c.ss + ' • Nữ ' + c.nu + ' • Bán trú ' + c.bt + ' • ' + c.gv + '</div></div>' +
      '<div class="field-row">' +
      '<div class="field"><label>Số HS vắng</label><input type="number" inputmode="numeric" min="0" max="' + c.ss + '" data-f="vang" placeholder="0"></div>' +
      '<div class="field"><label>Số vắng bán trú</label><input type="number" inputmode="numeric" min="0" max="' + c.bt + '" data-f="vangBT" placeholder="0"></div>' +
      '</div>' +
      '<div class="field"><label>Tên HS vắng</label><input type="text" data-f="tenVang" placeholder="Tên học sinh vắng, cách nhau bằng dấu phẩy"></div>' +
      '<div class="field"><label>Tên HS vắng bán trú</label><input type="text" data-f2="tenVangBT" placeholder="Tên học sinh vắng bán trú"></div>' +
      '<div class="hd-line" data-hd>Hiện diện: ' + c.ss + ' • HD bán trú: ' + c.bt + '</div>';
    grid.appendChild(card);
  });
  grid.addEventListener("input", (ev) => {
    const inp = ev.target.closest("input");
    if (!inp || !currentDate) return;
    const card = inp.closest(".class-card");
    const id = card.dataset.classId;
    readCardIntoData(card, id);
    saveHistory(currentDate, currentData);
    updateProgress();
    updateTotals();
    markCard(card, id);
  });
}

function readCardIntoData(card, id) {
  const get = (f) => { const el = card.querySelector('[data-f="' + f + '"]'); return el ? el.value.trim() : ""; };
  const vang = parseInt(get("vang"), 10);
  const vangBT = parseInt(get("vangBT"), 10);
  const entry = {
    vang: isNaN(vang) ? 0 : vang,
    tenVang: get("tenVang"),
    vangBT: isNaN(vangBT) ? 0 : vangBT,
    tenVangBT: card.querySelector('[data-f2="tenVangBT"]').value.trim()
  };
  if (entry.vang === 0 && entry.tenVang === "" && entry.vangBT === 0 && entry.tenVangBT === "") delete currentData[id];
  else currentData[id] = entry;
}

function fillCardFromData(card, id) {
  const e = currentData[id] || {};
  const set = (f, v) => { const el = card.querySelector('[data-f="' + f + '"]'); if (el) el.value = v; };
  set("vang", e.vang ? String(e.vang) : "");
  set("tenVang", e.tenVang || "");
  set("vangBT", e.vangBT ? String(e.vangBT) : "");
  const btName = card.querySelector('[data-f2="tenVangBT"]'); if (btName) btName.value = e.tenVangBT || "";
  updateHdLine(card, id);
  markCard(card, id);
}

function updateHdLine(card, id) {
  const c = CLASSES.find(x => x.id === id);
  const e = currentData[id] || {};
  const hd = c.ss - (e.vang || 0);
  const hdBT = c.bt - (e.vangBT || 0);
  const el = card.querySelector("[data-hd]");
  if (el) el.textContent = "Hiện diện: " + hd + " • HD bán trú: " + hdBT;
}

function classHasData(id) {
  const e = currentData[id];
  return !!(e && (e.vang > 0 || e.tenVang || e.vangBT > 0 || e.tenVangBT));
}

function markCard(card, id) { card.classList.toggle("has-data", classHasData(id)); }

function loadDayIntoForm() {
  document.querySelectorAll(".class-card").forEach(card => fillCardFromData(card, card.dataset.classId));
  updateProgress();
  updateTotals();
}

function updateProgress() {
  let n = 0; CLASSES.forEach(c => { if (classHasData(c.id)) n++; });
  $("progressFill").style.width = (n / 32 * 100) + "%";
  $("progressText").textContent = "Đã nhập " + n + "/32 lớp";
}

function updateTotals() {
  let v = 0, vbt = 0, hd = 0;
  CLASSES.forEach(c => {
    const e = currentData[c.id] || {};
    v += (e.vang || 0); vbt += (e.vangBT || 0); hd += (c.ss - (e.vang || 0));
  });
  $("totVang").textContent = v;
  $("totVangBT").textContent = vbt;
  $("totHD").textContent = hd;
}

/* ---------- Chọn lớp ---------- */
function applyPicker() {
  const val = $("classPicker").value;
  document.querySelectorAll(".class-card").forEach(card => {
    const show = (val === "all") || (val !== "" && card.dataset.classId === val);
    card.classList.toggle("hidden", !show);
    card.classList.toggle("single", val !== "all" && val !== "" && card.dataset.classId === val);
  });
}

/* ---------- Khóa giờ + chuyển ngày ---------- */
function setFormEnabled(enabled) {
  document.querySelectorAll("#classGrid input").forEach(el => { el.disabled = !enabled; });
  $("classPicker").disabled = !enabled;
}

function refreshClock() {
  const today = todaySG();
  const mins = minutesSG();

  if (today < START_DATE) {
    currentDate = null; formOpen = false;
    $("dateValue").textContent = "Bắt đầu nhập từ Thứ Ba, 24/11/2026";
    $("formArea").classList.add("hidden");
    setFormEnabled(false);
    showNotice("Hệ thống kiểm diện bắt đầu từ Thứ Ba, 24/11/2026.", "info");
    return;
  }

  const label = weekdayOf(today) + ", " + fmtDMY(today);
  $("dateValue").textContent = label;

  if (isWeekend(today)) {
    currentDate = null; formOpen = false;
    $("formArea").classList.add("hidden");
    setFormEnabled(false);
    showNotice("Hôm nay là ngày nghỉ, không có kiểm diện.", "info");
    return;
  }

  $("formArea").classList.remove("hidden");

  if (today !== currentDate) {
    currentDate = today;
    currentData = loadHistory(today) || {};
    loadDayIntoForm();
  }

  if (mins < OPEN_MIN) {
    formOpen = false; setFormEnabled(false);
    showNotice("Chưa tới giờ nhập — mở lúc 5:00 sáng.", "info");
  } else if (mins > LOCK_MIN) {
    formOpen = false; setFormEnabled(false);
    showNotice("Đã khóa — hết giờ nhập (khóa lúc 8:10 sáng). Dữ liệu đã nhập vẫn xem và xuất file được.", "warn");
  } else {
    formOpen = true; setFormEnabled(true);
    clearNotice();
  }
}

/* ---------- Xuất Excel (dùng chung cho nút Xuất, ZIP lịch sử, tải ngày) ---------- */
function b64ToBuffer(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

function hasAbsence(e) { return !!(e && (e.vang > 0 || (e.tenVang && e.tenVang !== ""))); }
function hasAbsenceBT(e) { return !!(e && (e.vangBT > 0 || (e.tenVangBT && e.tenVangBT !== ""))); }

async function buildExcelBuffer(dateStr, data) {
  if (typeof ExcelJS === "undefined") throw new Error("NO_EXCELJS");
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(b64ToBuffer(TEMPLATE_B64));
  const ws = wb.getWorksheet("KD");

  /* Ngày vào A2 (giữ định dạng ngày của mẫu). */
  const d = parseISO(dateStr);
  const a2 = ws.getCell("A2");
  a2.value = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));

  /* Sửa lỗi mẫu: D37 =B37-E36 → =B37-E37. */
  ws.getCell("D37").value = { formula: "B37-E37" };

  CLASSES.forEach(c => {
    const e = (data && data[c.id]) || {};
    const r = c.row;
    const cellE = ws.getCell("E" + r), cellF = ws.getCell("F" + r);
    const cellI = ws.getCell("I" + r), cellJ = ws.getCell("J" + r);

    if (hasAbsence(e)) {
      cellE.value = (e.vang > 0) ? e.vang : null;
      cellF.value = (e.tenVang && e.tenVang !== "") ? e.tenVang : null; /* xóa "/" thừa ở F32 khi không có tên */
    } else {
      cellE.value = null;
      cellF.value = "/";
      cellF.alignment = { horizontal: "center" };
    }

    if (hasAbsenceBT(e)) {
      cellI.value = (e.vangBT > 0) ? e.vangBT : null;
      cellJ.value = (e.tenVangBT && e.tenVangBT !== "") ? e.tenVangBT : null;
    } else {
      cellI.value = null;
      cellJ.value = "/";
      cellJ.alignment = { horizontal: "center" };
    }
  });

  return wb.xlsx.writeBuffer();
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  a.style.position = "fixed"; a.style.left = "0"; a.style.top = "0";
  a.style.width = "1px"; a.style.height = "1px"; a.style.opacity = "0";
  a.textContent = filename;
  document.body.appendChild(a);
  /* Dùng MouseEvent thay cho a.click() để một số trình duyệt nhận diện tốt hơn */
  a.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window }));
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
}

async function exportToday() {
  if (!currentDate) { showNotice("Hôm nay không có ngày nhập.", "warn"); return; }
  try {
    const buf = await buildExcelBuffer(currentDate, currentData);
    downloadBlob(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), excelNameFor(currentDate));
    showNotice("Đã tải file " + excelNameFor(currentDate) + ".", "ok");
  } catch (err) {
    if (err && err.message === "NO_EXCELJS") showNotice("Chưa tải được thư viện Excel — kiểm tra mạng rồi thử lại.", "error");
    else showNotice("Xuất file lỗi, thử lại giúp em.", "error");
  }
}

/* ---------- Tải lịch sử ---------- */
function schoolDaysInRange(startISO, endISO) {
  const days = [];
  let d = startISO;
  while (d <= endISO) {
    if (!isWeekend(d)) days.push(d);
    d = addDaysISO(d, 1);
  }
  return days;
}

async function downloadHistoryZip(days, zipName) {
  if (typeof JSZip === "undefined") { showNotice("Chưa tải được thư viện nén file — kiểm tra mạng rồi thử lại.", "error"); return; }
  const withData = days.filter(hasHistory);
  if (withData.length === 0) { showNotice("Chưa có dữ liệu nào trong tháng này.", "warn"); return; }
  try {
    const zip = new JSZip();
    for (const d of withData) {
      const buf = await buildExcelBuffer(d, loadHistory(d) || {});
      zip.file(excelNameFor(d), buf);
    }
    const blob = await zip.generateAsync({ type: "blob" });
    downloadBlob(blob, zipName);
    showNotice("Đã tải " + withData.length + " file trong " + zipName + ".", "ok");
  } catch (err) {
    if (err && err.message === "NO_EXCELJS") showNotice("Chưa tải được thư viện Excel — kiểm tra mạng rồi thử lại.", "error");
    else showNotice("Tải lịch sử lỗi, thử lại giúp em.", "error");
  }
}

function currentMonthRange() {
  const t = todaySG();
  const monthStart = t.slice(0, 8) + "01";
  const start = monthStart < START_DATE ? START_DATE : monthStart;
  const y = parseInt(t.slice(0, 4), 10), m = parseInt(t.slice(5, 7), 10);
  const monthEnd = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); /* ngày cuối tháng */
  const zipName = "KIỂM DIỆN tháng " + String(m).padStart(2, "0") + "-" + y + ".zip";
  return { start: start, monthEnd: monthEnd, today: t, zipName: zipName };
}

async function historyMonthToNow() {
  const r = currentMonthRange();
  await downloadHistoryZip(schoolDaysInRange(r.start, r.today), r.zipName);
}

async function historyWholeMonth() {
  const r = currentMonthRange();
  await downloadHistoryZip(schoolDaysInRange(r.start, r.monthEnd), r.zipName);
}

async function historyPickDate(dateStr) {
  if (!dateStr) return;
  if (isWeekend(dateStr)) { showNotice("Ngày " + fmtDMY(dateStr) + " là ngày nghỉ, không có kiểm diện.", "warn"); return; }
  const data = loadHistory(dateStr);
  try {
    const buf = await buildExcelBuffer(dateStr, data || {});
    downloadBlob(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), excelNameFor(dateStr));
    if (data) showNotice("Đã tải file " + excelNameFor(dateStr) + ".", "ok");
    else showNotice("Ngày này chưa có dữ liệu nhập — file tải về là mẫu trống.", "warn");
  } catch (err) {
    if (err && err.message === "NO_EXCELJS") showNotice("Chưa tải được thư viện Excel — kiểm tra mạng rồi thử lại.", "error");
    else showNotice("Tải file lỗi, thử lại giúp em.", "error");
  }
}

/* ---------- Gắn sự kiện ---------- */
function init() {
  migrateOldDraft();
  buildPicker();
  buildCards();
  $("classPicker").addEventListener("change", applyPicker);
  applyPicker();
  $("btnExportBottom").addEventListener("click", exportToday);

  const menu = $("historyMenu");
  $("btnHistory").addEventListener("click", (e) => { e.stopPropagation(); menu.classList.toggle("open"); });
  document.addEventListener("click", (e) => { if (!e.target.closest(".dropdown")) menu.classList.remove("open"); });
  menu.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-hist]");
    if (!btn) return;
    menu.classList.remove("open");
    const kind = btn.getAttribute("data-hist");
    const pick = $("pickDateInput");
    if (kind === "month-to-now") { pick.classList.add("hidden"); historyMonthToNow(); }
    else if (kind === "whole-month") { pick.classList.add("hidden"); historyWholeMonth(); }
    else if (kind === "pick-date") { pick.classList.remove("hidden"); pick.focus(); pick.showPicker && pick.showPicker(); }
  });
  $("pickDateInput").addEventListener("change", (e) => {
    const v = e.target.value;
    if (v) historyPickDate(v);
    e.target.value = "";
    e.target.classList.add("hidden");
  });

  refreshClock();
  setInterval(refreshClock, 60000); /* kiểm tra mỗi phút: mở/khóa đúng giờ, sang ngày mới */
}

document.addEventListener("DOMContentLoaded", init);
</script>
